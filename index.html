<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0f1419; color: #e6edf3; font-family: system-ui, sans-serif;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  #hud { display: flex; justify-content: space-between; align-items: center; width: min(92vw, 480px); margin-bottom: 8px; font-size: 18px; }
  #gear { background: #1c2530; border: 1px solid #2b3645; border-radius: 8px; padding: 4px 10px; font-size: 15px; }
  #gear:hover { background: #253140; }
  #wrap { position: relative; width: min(92vw, 480px); }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 1; border-radius: 10px; box-shadow: 0 0 0 2px #2a3441; }
  p { opacity: .6; font-size: 14px; margin-top: 10px; }

  /* settings panel */
  #panel {
    position: absolute; inset: 0; display: none; flex-direction: column; justify-content: safe center;
    gap: 14px; padding: 18px 22px; box-sizing: border-box; overflow-y: auto;
    background: rgba(15,20,25,.97); border-radius: 10px;
  }
  #panel.open { display: flex; }
  #panel h2 { margin: 0; font-size: 22px; }
  .row { display: flex; flex-direction: column; gap: 6px; }
  .row label { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
  .row small, .ends { font-size: 12px; opacity: .6; }
  .ends { display: flex; justify-content: space-between; }
  input[type=range] { width: 100%; accent-color: #4ade80; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; padding: 7px 0; background: #1c2530; border: 1px solid #2b3645; border-radius: 8px; }
  .seg button.on { background: #2b3645; border-color: #7d8ea6; font-weight: 600; }
  #swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
  .sw.on { border-color: #fff; }
  #custom { width: 34px; height: 30px; padding: 0; border: none; background: none; cursor: pointer; }
  #preview { display: inline-block; width: 56px; height: 14px; border-radius: 7px; }
  #done { padding: 9px; border: none; border-radius: 8px; background: #4ade80; color: #0f1419; font-weight: 700; }
</style>
</head>
<body>
<div id="hud">
  <span>Score: <b id="score">0</b></span>
  <button id="gear">⚙ Settings</button>
  <span>Best: <b id="best">0</b></span>
</div>

<div id="wrap">
  <canvas id="c" width="480" height="480"></canvas>

  <div id="panel">
    <h2>Settings</h2>

    <div class="row">
      <label>Start speed <b id="speedVal"></b></label>
      <input type="range" id="speed" min="0" max="12" step="1">
      <div class="ends"><span>Slowest (130 ms)</span><span>Fastest (70 ms)</span></div>
    </div>

    <div class="row">
      <label>Speed scaling</label>
      <div class="seg" id="scale">
        <button data-v="off">Off</button>
        <button data-v="slow">Slow</button>
        <button data-v="normal">Normal</button>
        <button data-v="fast">Fast</button>
      </div>
      <small>How much faster the snake gets with each apple.</small>
    </div>

    <div class="row">
      <label>Snake color <span id="preview"></span></label>
      <div id="swatches"><input type="color" id="custom" title="Custom color"></div>
    </div>

    <button id="done">Done</button>
  </div>
</div>

<p>Arrow keys or WASD to move · Space to start / restart · Esc closes settings</p>

<script>
const N = 20, S = 24, W = N * S;                       // grid size, cell size in px
const SLOWEST = 130, FASTEST = 70, STEP_MS = 5;        // start speed range (ms per move)
const MIN_MS = 40;                                     // speed scaling never goes faster than this
const RATES = { off: 0, slow: 1, normal: 2, fast: 4 }; // ms faster per apple
const COLORS = ['#4ade80', '#38bdf8', '#a78bfa', '#f472b6', '#fb923c', '#facc15', '#f1f5f9'];

const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const scoreEl = $('score'), bestEl = $('best'), panel = $('panel'), speedIn = $('speed');
const KEYS = {
  arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1],
  arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0]
};
let snake, dir, queue, apple, score, timer, state = 'ready', best = 0;
let msg = ['Snake', 'Press Space or an arrow key'];

// ---------- saved data ----------
let settings = { speed: SLOWEST, scale: 'normal', color: COLORS[0] };
try {
  best = +localStorage.getItem('snakeBest') || 0;
  const s = JSON.parse(localStorage.getItem('snakeSettings'));
  if (s && s.speed >= FASTEST && s.speed <= SLOWEST) settings.speed = s.speed;
  if (s && s.scale in RATES) settings.scale = s.scale;
  if (s && /^#[0-9a-f]{6}$/i.test(s.color)) settings.color = s.color;
} catch (e) {}
bestEl.textContent = best;

function saveSettings() {
  try { localStorage.setItem('snakeSettings', JSON.stringify(settings)); } catch (e) {}
}

// ---------- game logic ----------
function delay() {
  // starts at your chosen speed and gets faster with every apple eaten
  return Math.max(MIN_MS, settings.speed - (score / 10) * RATES[settings.scale]);
}

function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 };
  queue = [];
  score = 0;
  scoreEl.textContent = 0;
  placeApple();
}

function placeApple() {
  do {
    apple = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
  } while (snake.some(s => s.x === apple.x && s.y === apple.y));
}

function start() {
  clearTimeout(timer);
  reset();
  state = 'running';
  msg = null;
  draw();
  timer = setTimeout(step, delay());
}

function step() {
  if (queue.length) dir = queue.shift();
  const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const eat = h.x === apple.x && h.y === apple.y;
  const body = eat ? snake : snake.slice(0, -1);
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || body.some(s => s.x === h.x && s.y === h.y)) {
    return gameOver('Game Over');
  }
  snake.unshift(h);
  if (eat) {
    score += 10;
    scoreEl.textContent = score;
    if (snake.length === N * N) return gameOver('You Win!');
    placeApple();
  } else {
    snake.pop();
  }
  draw();
  timer = setTimeout(step, delay());
}

function gameOver(title) {
  state = 'over';
  clearTimeout(timer);
  if (score > best) {
    best = score;
    bestEl.textContent = best;
    try { localStorage.setItem('snakeBest', best); } catch (e) {}
  }
  msg = [title, 'Score ' + score + ' · Space to restart'];
  redraw();
}

// ---------- drawing ----------
function draw() {
  // background + grid lines
  ctx.fillStyle = '#161d26';
  ctx.fillRect(0, 0, W, W);
  ctx.strokeStyle = '#2b3645';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i <= N; i++) {
    const p = Math.min(i * S + 0.5, W - 0.5);
    ctx.moveTo(p, 0); ctx.lineTo(p, W);
    ctx.moveTo(0, p); ctx.lineTo(W, p);
  }
  ctx.stroke();

  // apple (circle)
  const ax = (apple.x + 0.5) * S, ay = (apple.y + 0.5) * S;
  ctx.fillStyle = '#ff4d4d';
  ctx.beginPath(); ctx.arc(ax, ay, S * 0.38, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.arc(ax - S * 0.12, ay - S * 0.12, S * 0.1, 0, Math.PI * 2); ctx.fill();

  // snake: one smooth rounded line through the cell centers
  const pts = snake.map(s => ({ x: (s.x + 0.5) * S, y: (s.y + 0.5) * S }));
  const mid = (a, b) => [(a.x + b.x) / 2, (a.y + b.y) / 2];
  ctx.lineCap = ctx.lineJoin = 'round';
  ctx.lineWidth = S * 0.72;
  ctx.strokeStyle = settings.color;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  ctx.lineTo(...mid(pts[0], pts[1]));
  for (let i = 1; i < pts.length - 1; i++) {
    ctx.quadraticCurveTo(pts[i].x, pts[i].y, ...mid(pts[i], pts[i + 1]));
  }
  ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
  ctx.stroke();

  // eyes
  const hd = pts[0], px = -dir.y, py = dir.x;
  for (const side of [-1, 1]) {
    const ex = hd.x + dir.x * S * 0.12 + px * side * S * 0.2;
    const ey = hd.y + dir.y * S * 0.12 + py * side * S * 0.2;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex, ey, S * 0.11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(ex + dir.x * S * 0.03, ey + dir.y * S * 0.03, S * 0.055, 0, Math.PI * 2); ctx.fill();
  }
}

function overlay(title, sub) {
  ctx.fillStyle = 'rgba(15,20,25,.72)';
  ctx.fillRect(0, 0, W, W);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = 'bold 32px system-ui, sans-serif';
  ctx.fillText(title, W / 2, W / 2 - 8);
  ctx.font = '16px system-ui, sans-serif';
  ctx.fillText(sub, W / 2, W / 2 + 24);
}

function redraw() {
  draw();
  if (msg) overlay(msg[0], msg[1]);
}

// ---------- settings panel ----------
function syncPanel() {
  speedIn.value = (SLOWEST - settings.speed) / STEP_MS;
  $('speedVal').textContent = settings.speed + ' ms';
  document.querySelectorAll('#scale button').forEach(b => b.classList.toggle('on', b.dataset.v === settings.scale));
  document.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.c === settings.color));
  $('custom').value = settings.color;
  $('preview').style.background = settings.color;
}

function openSettings() {
  if (panel.classList.contains('open')) return;
  if (state === 'running') { clearTimeout(timer); state = 'paused'; }   // pause while open
  syncPanel();
  panel.classList.add('open');
}

function closeSettings() {
  panel.classList.remove('open');
  if (document.activeElement) document.activeElement.blur();
  redraw();
  if (state === 'paused') { state = 'running'; timer = setTimeout(step, delay()); }
}

function setColor(c) {
  settings.color = c;
  saveSettings();
  syncPanel();
  redraw();
}

COLORS.forEach(c => {
  const b = document.createElement('button');
  b.className = 'sw'; b.dataset.c = c; b.style.background = c; b.title = c;
  b.onclick = () => setColor(c);
  $('custom').before(b);
});
$('custom').oninput = e => setColor(e.target.value);

speedIn.oninput = () => {
  settings.speed = SLOWEST - speedIn.value * STEP_MS;
  $('speedVal').textContent = settings.speed + ' ms';
  saveSettings();
};

document.querySelectorAll('#scale button').forEach(b => {
  b.onclick = () => { settings.scale = b.dataset.v; saveSettings(); syncPanel(); };
});

$('gear').onclick = () => { openSettings(); $('gear').blur(); };
$('done').onclick = closeSettings;

// ---------- controls ----------
addEventListener('keydown', e => {
  if (panel.classList.contains('open')) {           // settings open: ignore game keys
    if (e.key === 'Escape') closeSettings();
    return;
  }
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); if (state !== 'running') start(); return; }
  const d = KEYS[k];
  if (!d) return;
  e.preventDefault();                               // stops arrow keys scrolling the page
  if (state === 'ready') start();
  if (state !== 'running') return;
  const last = queue.length ? queue[queue.length - 1] : dir;
  const opposite = d[0] === -last.x && d[1] === -last.y;
  const same = d[0] === last.x && d[1] === last.y;
  if (queue.length < 2 && !opposite && !same) queue.push({ x: d[0], y: d[1] });
});

reset();
redraw();
</script>
</body>
</html>
